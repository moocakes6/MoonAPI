<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoonAPI — 每日知识卡片 API</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23e0b64a'/><circle cx='64' cy='42' r='34' fill='%230d1321'/></svg>">
<style>
  :root {
    --ink: #0d1321; --gold: #e0b64a; --gold-strong: #a8841a;
    --serif: Georgia, 'Times New Roman', 'Songti SC', 'SimSun', serif;
    --sans: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    --mono: 'Cascadia Code', Consolas, 'Courier New', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--sans); min-height: 100vh; color: #e8e6df;
    background: radial-gradient(1100px 640px at 72% -10%, #22315c 0%, var(--ink) 56%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 48px 22px; position: relative; overflow-x: hidden;
  }
  .stars {
    position: fixed; inset: 0; pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 14% 22%, #fff7 0, transparent 60%),
      radial-gradient(1.5px 1.5px at 76% 14%, #fff5 0, transparent 60%),
      radial-gradient(1px 1px at 34% 72%, #fff4 0, transparent 60%),
      radial-gradient(2px 2px at 88% 58%, #ffe9ad55 0, transparent 60%),
      radial-gradient(1px 1px at 52% 40%, #fff3 0, transparent 60%),
      radial-gradient(1.5px 1.5px at 8% 84%, #fff4 0, transparent 60%);
  }
  .moon {
    width: 84px; height: 84px; border-radius: 50%; margin-bottom: 26px;
    background: radial-gradient(circle at 34% 32%, #fff7dd, #e8cf8f 58%, #b99b4f);
    box-shadow: 0 0 70px 14px rgba(232, 207, 143, .22); position: relative;
  }
  .moon::after {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    background:
      radial-gradient(12px 12px at 62% 30%, #d9bd7d55 0, transparent 70%),
      radial-gradient(9px 9px at 40% 62%, #d9bd7d4d 0, transparent 70%);
  }
  h1 { font-family: var(--serif); font-size: clamp(2rem, 5vw, 3rem); letter-spacing: .08em; font-weight: 600; }
  .sub { margin: 14px 0 34px; color: #9aa3bd; text-align: center; max-width: 560px; line-height: 1.8; font-size: .95rem; }
  .sub .ep { font-family: var(--mono); color: var(--gold); }
  .actions { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  a.btn {
    text-decoration: none; padding: 12px 26px; border-radius: 9px; font-size: .92rem; letter-spacing: .04em;
    transition: transform .15s, box-shadow .15s;
  }
  a.btn:hover { transform: translateY(-2px); }
  a.primary { background: var(--gold); color: var(--ink); font-weight: 700; box-shadow: 0 8px 26px rgba(224, 182, 74, .28); }
  a.ghost { border: 1px solid #3a4a75; color: #d7d9e3; }
  a.ghost:hover { border-color: var(--gold); color: var(--gold); }
  .snippet {
    margin-top: 44px; background: rgba(14, 20, 38, .85); border: 1px solid #2c3a60; border-radius: 12px;
    padding: 18px 22px; font-family: var(--mono); font-size: .82rem; color: #cfd3e2; max-width: 640px;
    width: 100%; overflow-x: auto; line-height: 1.8;
  }
  .snippet .c { color: #767f9e; }
  .snippet .k { color: var(--gold); }
  footer { margin-top: 48px; color: #6f7690; font-size: .78rem; letter-spacing: .06em; text-align: center; }
</style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <div class="moon" aria-hidden="true"></div>
  <h1>MoonAPI</h1>
  <p class="sub">
    自建存储驱动的 API 服务。当前提供 <span class="ep">GET /api/v1/daily-card</span> ——
    每日知识卡片接口：携带 API Key 请求，每天返回一张不同的知识卡片。
  </p>
  <div class="actions">
    <a class="btn primary" href="/docs/">接口文档</a>
    <a class="btn ghost" href="/admin/">管理后台</a>
  </div>
  <div class="snippet">
    <span class="c"># 快速调用</span><br>
    curl https://api.lunor.top/api/v1/daily-card \<br>
    &nbsp;&nbsp;-H <span class="k">"Authorization: Bearer mk_live_xxxx"</span>
  </div>
  <footer>MoonAPI · Cloudflare Pages + R2 + KV · lunor.top</footer>
</body>
</html>
